name: Testes da aplicação
on:
  push:
    branches: [conferencia-maciel-20261103, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
